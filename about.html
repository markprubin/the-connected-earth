<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About — The Connected Earth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Beth+Ellen&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Formera';
      src: url('content/fonts/Formera-Regular.otf') format('opentype');
      font-weight: 400;
    }

    @font-face {
      font-family: 'Formera';
      src: url('content/fonts/Formera-Light.otf') format('opentype');
      font-weight: 300;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      font-family: 'Formera', sans-serif;
      background: #f5f2ee;
      color: #2a2a2a;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 48px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }

    header a.home {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    header img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    header .site-name {
      font-family: 'Beth Ellen', cursive;
      font-size: 1.1rem;
      color: #2a2a2a;
    }

    nav {
      display: flex;
      gap: 36px;
    }

    nav a {
      font-family: 'Formera', sans-serif;
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #2a2a2a;
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.2s ease;
    }

    nav a:hover {
      opacity: 1;
    }

    main {
      max-width: 720px;
      margin: 80px auto;
      padding: 0 48px;
    }

    h1 {
      font-family: 'Beth Ellen', cursive;
      font-size: 2.5rem;
      margin-bottom: 32px;
      font-weight: 400;
    }

    p {
      font-size: 1rem;
      line-height: 1.75;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <header>
    <a class="home" href="index.html">
      <img src="content/images/Logo_Circle.png" alt="The Connected Earth logo" />
      <span class="site-name">the connected earth</span>
    </a>
    <nav>
      <a href="about.html">About</a>
      <a href="stories.html">Stories</a>
    </nav>
  </header>
  <main>
    <h1>About</h1>
    <p>Placeholder content coming soon.</p>
  </main>
</body>
</html>
