document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

00%; height:100%; display:block\">\n      <g class=\"grat\"><\u002Fg>\n      <g class=\"land\"><\u002Fg>\n    <\u002Fsvg>\n\n    <!-- soft light wash -->\n    <div style=\"position:absolute; inset:0; pointer-events:none; background:radial-gradient(70% 60% at 24% 26%, rgba(255,253,248,.5), rgba(0,0,0,0) 60%)\"><\u002Fdiv>\n\n    <!-- HEADER -->\n    <sc-if value=\"{{ showHeader }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"position:absolute; top:7%; left:5%; z-index:5; pointer-events:none\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:0.72vw; letter-spacing:.34em; text-transform:uppercase; color:#9a8f7c; margin-bottom:1.1vh\">Field Interviews<\u002Fdiv>\n        <div style=\"font-size:2.5vw; font-weight:700; color:#1a1714; line-height:1.05; letter-spacing:-0.025em\">Where the stories<br>were reported<\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:0.7vw; margin-top:1.8vh\">\n          <div style=\"width:2.2vw; height:1.5px; background:#1a1714\"><\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:0.74vw; color:#9a8f7c; letter-spacing:.04em\">{{ count }} locations<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- hint -->\n    <div style=\"position:absolute; bottom:6.5%; left:5%; z-index:5; pointer-events:none; font-family:'IBM Plex Mono',monospace; font-size:0.66vw; color:#a99f8c; letter-spacing:.12em; text-transform:uppercase\">Hover a marker · click to open the story<\u002Fdiv>\n\n    <!-- PINS -->\n    <div style=\"position:absolute; inset:0; pointer-events:none; z-index:6\">\n      <sc-for list=\"{{ pins }}\" as=\"pin\" hint-placeholder-count=\"3\">\n        <div style=\"position:absolute; left:{{ pin.left }}; top:{{ pin.top }}; width:0; height:0; pointer-events:auto; cursor:pointer; color:{{ pin.glow }}\" onmouseenter=\"{{ pin.enter }}\" onmouseleave=\"{{ pin.leave }}\" onclick=\"{{ pin.click }}\">\n          <div style=\"position:absolute; left:-6px; top:-6px; width:12px; height:12px; border-radius:50%; background:currentColor; transform-origin:center; animation:soft-ring 3s ease-out infinite\"><\u002Fdiv>\n          <div style=\"position:absolute; left:-6px; top:-6px; width:12px; height:12px; border-radius:50%; background:currentColor; transform-origin:center; animation:soft-ring2 3s ease-out infinite .6s\"><\u002Fdiv>\n          <div style=\"position:absolute; left:-5px; top:-5px; width:10px; height:10px; border-radius:50%; background:currentColor; box-shadow:0 0 0 3px #fffdf8, 0 1px 5px rgba(26,23,20,.3); transform:scale({{ pin.dotScale }}); transition:transform .22s cubic-bezier(.2,.8,.2,1)\"><\u002Fdiv>\n          <div style=\"position:absolute; left:0; top:15px; transform:translateX(-50%); opacity:{{ pin.labelOpacity }}; transition:opacity .2s ease; pointer-events:none; white-space:nowrap; background:#ffffff; border:1px solid #e7dfce; border-radius:9px; padding:6px 12px 7px; box-shadow:0 8px 22px rgba(26,23,20,.12)\">\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:0.6vw; letter-spacing:.14em; text-transform:uppercase; color:#a99f8c\">{{ pin.city }}<\u002Fdiv>\n            <div style=\"font-size:0.82vw; font-weight:600; color:#1a1714; margin-top:2px\">{{ pin.name }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <!-- CARD -->\n    <sc-if value=\"{{ card }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"position:absolute; left:{{ card.left }}; top:{{ card.top }}; transform:{{ card.transform }}; z-index:10; width:19vw; min-width:240px; max-width:330px; background:#ffffff; border:1px solid #e9e1d0; border-radius:16px; padding:1.5vw 1.6vw; box-shadow:0 28px 60px rgba(26,23,20,.16); animation:card-in .26s cubic-bezier(.2,.8,.2,1) both\" onclick=\"{{ stop }}\">\n        <div onclick=\"{{ closeCard }}\" style=\"position:absolute; top:1vw; right:1.1vw; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#a99f8c; cursor:pointer; font-size:17px; line-height:1; background:#f6f1e8\" style-hover=\"color:#1a1714; background:#efe7d8\">×<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:0.7vw; letter-spacing:.18em; text-transform:uppercase; color:#a99f8c; margin-bottom:1.1vh\">{{ card.city }}<\u002Fdiv>\n        <div style=\"font-size:1.5vw; font-weight:700; color:#1a1714; line-height:1.12; letter-spacing:-0.02em\">{{ card.name }}<\u002Fdiv>\n        <div style=\"font-size:1vw; color:#6f665a; line-height:1.45; margin-top:0.9vh\">{{ card.story }}<\u002Fdiv>\n        <div style=\"height:1px; background:#eee6d6; margin:1.5vh 0\"><\u002Fdiv>\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:10px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:0.72vw; color:#a99f8c; letter-spacing:.03em\">{{ card.date }}<\u002Fdiv>\n          <a href=\"{{ card.link }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:0.8vw; font-weight:600; letter-spacing:.01em; color:#fdfaf4; text-decoration:none; background:#1a1714; border-radius:999px; padding:6px 14px; white-space:nowrap\" style-hover=\"background:#000\">Read story →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: { &quot;width&quot;: 1280, &quot;height&quot;: 720 },\n  &quot;glowColor&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#1a1714&quot;, &quot;tsType&quot;: &quot;string&quot; },\n  &quot;showGraticule&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot; },\n  &quot;showHeader&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot; }\n}\">\nclass Component extends DCLogic {\n  state = { pts: {}, ready: false, hoveredId: null, selectedId: null };\n\n  locations = ((typeof window !== 'undefined' && window.INTERVIEW_LOCATIONS) || [\n    { city: 'Santa Rosa, CA', lon: -122.7141, lat: 38.4404, name: 'Maria Alvarez', story: 'After the Tubbs Fire', date: 'Mar 2025', link: '#' },\n    { city: 'Phoenix, AZ', lon: -112.0740, lat: 33.4484, name: 'James Okafor', story: 'Heat and the Grid', date: 'Jul 2025', link: '#' },\n    { city: 'Cape Town, South Africa', lon: 18.4241, lat: -33.9249, name: 'Nomsa Dlamini', story: 'Day Zero, Five Years On', date: 'Jan 2026', link: '#' },\n  ]).map((l, i) => ({ id: l.id || ('loc-' + i), link: '#', ...l }));\n\n  waitFor(cond, ms = 9000) {\n    return new Promise((res, rej) => {\n      const t0 = Date.now();\n      const i = setInterval(() => {\n        if (cond()) { clearInterval(i); res(); }\n        else if (Date.now() - t0 > ms) { clearInterval(i); rej(new Error('timeout')); }\n      }, 50);\n    });\n  }\n\n  async componentDidMount() {\n    try {\n      await this.waitFor(() => window.d3 && window.topojson && this.mapRef);\n      const d3 = window.d3, topojson = window.topojson;\n\n      // Listen for locations pushed from a host page (e.g. an Astro component via postMessage)\n      this._onMsg = (ev) => {\n        const d = ev && ev.data;\n        if (d && d.type === 'interview-locations' && Array.isArray(d.locations) && d.locations.length) this.setLocations(d.locations);\n      };\n      window.addEventListener('message', this._onMsg);\n\n      // Optional: load locations from a sibling locations.json (easiest place to edit)\n      try {\n        const res = await fetch('./locations.json', { cache: 'no-store' });\n        if (res.ok) {\n          const data = await res.json();\n          if (Array.isArray(data) && data.length) {\n            this.locations = data.map((l, i) => ({ id: l.id || ('loc-' + i), link: '#', ...l }));\n          }\n        }\n      } catch (e) { /* no external file — fall back to the built-in list */ }\n\n      const W = 1600, H = 900;\n      const projection = d3.geoMercator().scale(W / (2 * Math.PI)).translate([W / 2, H / 2 + 78]);\n      const path = d3.geoPath(projection);\n      this.projection = projection;\n      const svg = d3.select(this.mapRef);\n\n      const world = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json').then(r => r.json());\n      const land = topojson.merge(world, world.objects.countries.geometries);\n\n      // artistic defs: soft tonal land fill + floating drop shadow\n      const defs = svg.append('defs');\n      const lg = defs.append('linearGradient').attr('id', 'landfill')\n        .attr('x1', '0').attr('y1', '0').attr('x2', '0').attr('y2', '1');\n      lg.append('stop').attr('offset', '0%').attr('stop-color', '#fffefa');\n      lg.append('stop').attr('offset', '55%').attr('stop-color', '#fbf4e6');\n      lg.append('stop').attr('offset', '100%').attr('stop-color', '#f0e4cd');\n      const flt = defs.append('filter').attr('id', 'landshadow')\n        .attr('x', '-20%').attr('y', '-20%').attr('width', '140%').attr('height', '140%');\n      flt.append('feDropShadow').attr('dx', 0).attr('dy', 2)\n        .attr('stdDeviation', 7).attr('flood-color', '#9c8a64').attr('flood-opacity', 0.42);\n\n      const grat = d3.geoGraticule().step([20, 20]);\n      svg.select('.grat').append('path').datum(grat())\n        .attr('d', path).attr('fill', 'none')\n        .attr('stroke', 'rgba(120,98,60,0.10)').attr('stroke-width', 0.6)\n        .attr('vector-effect', 'non-scaling-stroke');\n\n      // single merged landmass — smooth silhouette, no internal borders\n      svg.select('.land').append('path')\n        .datum(land)\n        .attr('d', path)\n        .attr('fill', 'url(#landfill)')\n        .attr('stroke', 'rgba(58,46,26,0.30)')\n        .attr('stroke-width', 0.8)\n        .attr('stroke-linejoin', 'round')\n        .attr('vector-effect', 'non-scaling-stroke')\n        .attr('filter', 'url(#landshadow)');\n\n      const pts = {};\n      this.locations.forEach(l => { const p = projection([l.lon, l.lat]); if (p) pts[l.id] = { x: p[0], y: p[1] }; });\n      this.applyGrat();\n      this.setState({ pts, ready: true });\n    } catch (e) {\n      console.error('map init failed', e);\n    }\n  }\n\n  applyGrat() {\n    if (window.d3 && this.mapRef) {\n      const show = this.props.showGraticule ?? true;\n      window.d3.select(this.mapRef).select('.grat').attr('opacity', show ? 1 : 0);\n    }\n  }\n\n  componentDidUpdate() { this.applyGrat(); }\n\n  componentWillUnmount() { if (this._onMsg) window.removeEventListener('message', this._onMsg); }\n\n  setLocations(arr) {\n    this.locations = arr.map((l, i) => ({ id: l.id || ('loc-' + i), link: '#', ...l }));\n    if (this.projection) {\n      const pts = {};\n      this.locations.forEach(l => { const p = this.projection([l.lon, l.lat]); if (p) pts[l.id] = { x: p[0], y: p[1] }; });\n      this.setState({ pts, selectedId: null, hoveredId: null });\n    } else {\n      this.forceUpdate();\n    }\n  }\n\n  renderVals() {\n    const glow = this.props.glowColor ?? '#1a1714';\n    const pts = this.state.pts || {};\n    const hov = this.state.hoveredId, sel = this.state.selectedId;\n\n    const pins = this.locations.map(l => {\n      const p = pts[l.id];\n      const has = !!p;\n      const active = hov === l.id || sel === l.id;\n      return {\n        ...l, glow,\n        left: has ? (p.x / 1600 * 100) + '%' : '-200px',\n        top: has ? (p.y / 900 * 100) + '%' : '-200px',\n        labelOpacity: active ? 1 : 0,\n        dotScale: active ? 1.5 : 1,\n        enter: () => this.setState({ hoveredId: l.id }),\n        leave: () => this.setState({ hoveredId: null }),\n        click: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.setState(s => ({ selectedId: s.selectedId === l.id ? null : l.id })); },\n      };\n    });\n\n    let card = null;\n    if (sel) {\n      const l = this.locations.find(x => x.id === sel);\n      const p = pts[sel];\n      if (l && p) {\n        const right = p.x > 800;\n        const topPct = Math.min(82, Math.max(16, p.y / 900 * 100));\n        card = {\n          ...l,\n          left: (p.x / 1600 * 100) + '%',\n          top: topPct + '%',\n          transform: right ? 'translate(calc(-100% - 22px), -50%)' : 'translate(22px, -50%)',\n        };\n      }\n    }\n\n    return {\n      pins, card, glow,\n      showHeader: this.props.showHeader ?? true,\n      count: String(this.locations.length).padStart(2, '0'),\n      setMapRef: (el) => { this.mapRef = el; },\n      onBgClick: () => this.setState({ selectedId: null }),\n      closeCard: () => this.setState({ selectedId: null }),\n      stop: (e) => { if (e && e.stopPropagation) e.stopPropagation(); },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
