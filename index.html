<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Connected Earth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Beth+Ellen&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Formera';
      src: url('content/fonts/Formera-Regular.otf') format('opentype');
      font-weight: 400;
    }

    @font-face {
      font-family: 'Formera';
      src: url('content/fonts/Formera-Light.otf') format('opentype');
      font-weight: 300;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      font-family: sans-serif;
      overflow: hidden;
    }

    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: url('content/images/pexels-abdghat-1631677.jpg') center center / cover no-repeat;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.12);
      pointer-events: none;
      z-index: 0;
    }

    .logo {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 110px;
      object-fit: contain;
      filter: drop-shadow(0 2px 12px rgba(0,0,0,0.15));
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .site-title {
      font-family: 'Beth Ellen', cursive;
      font-size: clamp(1.98rem, 4.62vw, 3.63rem);
      color: #ffffff;
      letter-spacing: 0.01em;
      line-height: 1;
      margin-bottom: 32px;
      text-shadow: 0 1px 20px rgba(0,0,0,0.12);
    }

    nav {
      display: flex;
      gap: 52px;
      align-items: center;
    }

    nav a {
      font-family: 'Formera', sans-serif;
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      padding: 4px 8px;
      border-radius: 4px;
      transition: color 0.2s ease, background 0.2s ease;
    }

    nav a:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <section class="hero">
    <img
      class="logo"
      src="content/images/Logo_Circle.png"
      alt="The Connected Earth logo"
    />
    <div class="hero-content">
      <h1 class="site-title">the connected earth</h1>
      <nav>
        <a href="about.html">About</a>
        <a href="stories.html">Stories</a>
      </nav>
    </div>
  </section>
</body>
</html>
